<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 13px;
      --bg: rgba(247, 241, 229, .985);
      --bg-deep: #f0e6d4;
      --ink: #302b25;
      --muted: #7b7164;
      --hairline: rgba(64, 52, 38, .13);
      --surface: rgba(255, 255, 255, .48);
      --surface-hover: rgba(255, 255, 255, .75);
      --accent: #9b6828;
      --accent-top: #b47e3d;
      --accent-ink: #fffaf1;
      --shadow: rgba(39, 29, 18, .24);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }
    body.ready { opacity: 1; }

    button, select, input { font: inherit; }
    button { color: inherit; }

    .shell {
      position: absolute;
      inset: 10px 8px 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 13%, rgba(255,255,255,.72), transparent 36%),
        linear-gradient(155deg, var(--bg), var(--bg-deep));
      border: 1px solid rgba(72, 57, 38, .16);
      border-radius: 19px;
      box-shadow: 0 15px 42px var(--shadow), 0 3px 9px rgba(0,0,0,.11);
      transition: color 480ms ease, background 480ms ease, border-color 480ms ease;
    }
    .shell::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: -6px;
      left: calc(var(--arrow-x, 50%) - 7px);
      width: 14px;
      height: 14px;
      background: var(--bg);
      border-left: 1px solid rgba(72, 57, 38, .16);
      border-top: 1px solid rgba(72, 57, 38, .16);
      transform: rotate(45deg);
      transition: background 480ms ease, border-color 480ms ease;
    }
    .shell.active {
      --bg: rgba(35, 45, 59, .99);
      --bg-deep: #182431;
      --ink: #edf2f4;
      --muted: #aeb8c2;
      --hairline: rgba(224, 235, 242, .13);
      --surface: rgba(255, 255, 255, .065);
      --surface-hover: rgba(255, 255, 255, .11);
      --accent: #8199b2;
      --accent-top: #9cacc0;
      --accent-ink: #101a24;
      --shadow: rgba(4, 11, 18, .42);
      border-color: rgba(210, 224, 236, .19);
    }

    .header {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      flex: 0 0 50px;
      padding: 5px 14px 0;
    }
    .app-title { text-align: center; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    .icon-button {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: background 130ms ease, color 130ms ease;
    }
    .icon-button:hover { color: var(--ink); background: var(--surface-hover); }
    .icon-button svg { width: 18px; height: 18px; }

    .view-stack { position: relative; flex: 1; min-height: 0; }
    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 0 18px 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(18px);
      transition: opacity 180ms ease, transform 220ms cubic-bezier(.2,.8,.2,1);
    }
    .view.visible { opacity: 1; pointer-events: auto; transform: translateX(0); }
    .main-view:not(.visible) { transform: translateX(-18px); }

    .hero {
      position: relative;
      width: 158px;
      height: 158px;
      margin: 0 auto;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,.56), rgba(255,255,255,.08) 58%, transparent 59%),
        radial-gradient(circle, rgba(139, 91, 34, .12), transparent 69%);
      box-shadow: inset 0 0 0 1px var(--hairline), 0 9px 30px rgba(83, 57, 24, .08);
      cursor: pointer;
      perspective: 760px;
      transition: transform 130ms ease, box-shadow 480ms ease, background 480ms ease;
    }
    .active .hero {
      background:
        radial-gradient(circle, rgba(183,207,225,.15), rgba(255,255,255,.025) 58%, transparent 59%),
        radial-gradient(circle, rgba(108, 144, 173, .15), transparent 69%);
      box-shadow: inset 0 0 0 1px var(--hairline), 0 12px 34px rgba(0, 8, 18, .18);
    }
    .hero:hover { transform: scale(1.018); }
    .hero:active { transform: scale(.985); }
    .hero:focus-visible, .primary:focus-visible, .icon-button:focus-visible, select:focus-visible, .switch input:focus-visible + span {
      outline: 3px solid rgba(63, 140, 214, .52);
      outline-offset: 2px;
    }

    .coin { position: absolute; inset: 9px; transform-style: preserve-3d; transition: transform 520ms cubic-bezier(.22,.78,.18,1.12); }
    .active .coin { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .face.back { transform: rotateY(180deg); }
    .face img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; filter: drop-shadow(0 6px 7px rgba(46,28,8,.18)); }
    .face.back img { width: 94%; height: 94%; filter: drop-shadow(0 7px 8px rgba(0,10,20,.28)); }

    .status { margin: 9px 0 0; text-align: center; }
    .status h1 { margin: 0; font-size: 22px; line-height: 1.18; font-weight: 680; letter-spacing: -.025em; }
    .summary { min-height: 18px; margin: 5px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
    .warning { display: none; margin: 5px auto 0; max-width: 290px; color: #bb5b34; font-size: 11.5px; line-height: 1.3; }
    .warning.show { display: block; }

    .primary {
      width: 100%;
      height: 38px;
      margin: 11px 0 10px;
      border: 1px solid rgba(77, 52, 22, .18);
      border-radius: 10px;
      color: var(--accent-ink);
      background: linear-gradient(180deg, var(--accent-top), var(--accent));
      box-shadow: inset 0 1px rgba(255,255,255,.2), 0 2px 5px rgba(45,31,17,.12);
      font-weight: 620;
      cursor: pointer;
      transition: filter 120ms ease, transform 120ms ease, background 480ms ease;
    }
    .primary:hover { filter: brightness(1.07); }
    .primary:active { transform: translateY(1px); filter: brightness(.98); }
    .primary[disabled] { cursor: default; opacity: .72; }

    .card { overflow: hidden; border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface); }
    .row { display: flex; align-items: center; min-height: 42px; padding: 0 12px; gap: 10px; border-bottom: 1px solid var(--hairline); }
    .row:last-child { border-bottom: 0; }
    .row label, .row .row-label { flex: 1; min-width: 0; line-height: 1.25; }
    select {
      max-width: 145px;
      padding: 4px 22px 4px 7px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      text-align: right;
      cursor: pointer;
    }
    select:hover { color: var(--ink); background: var(--surface-hover); }

    .switch { position: relative; flex: 0 0 auto; width: 34px; height: 20px; }
    .switch input { position: absolute; opacity: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 12px; background: rgba(102,98,91,.26); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: background 180ms ease; cursor: pointer; }
    .switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.26); transition: transform 180ms cubic-bezier(.2,.8,.2,1); }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(14px); }

    .footer { display: flex; align-items: center; justify-content: center; height: 38px; margin-top: auto; padding-top: 8px; }
    .text-button { border: 0; color: var(--muted); background: transparent; cursor: pointer; padding: 6px 11px; border-radius: 7px; }
    .text-button:hover { color: var(--ink); background: var(--surface-hover); }
    .divider { width: 1px; height: 17px; margin: 0 3px; background: var(--hairline); }

    .settings-view { padding-top: 0; }
    .settings-head { display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; height: 39px; margin: -2px 0 7px; }
    .settings-head h2 { margin: 0; text-align: center; font-size: 16px; font-weight: 660; }
    .settings-view .card { flex: 0 0 auto; }
    .settings-view .row { min-height: 39px; }
    .language-row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 10px; padding: 4px; border: 1px solid var(--hairline); border-radius: 10px; background: var(--surface); }
    .language-row button { height: 30px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer; }
    .language-row button.selected { color: var(--ink); background: var(--surface-hover); box-shadow: 0 1px 3px rgba(0,0,0,.1); font-weight: 610; }
    .settings-actions { display: flex; justify-content: center; gap: 4px; margin-top: auto; padding-top: 10px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 150ms !important; animation-duration: 150ms !important; }
      .coin, .active .coin { transform: none; }
      .face { transition: opacity 150ms ease !important; }
      .face.front { opacity: 1; }
      .face.back { opacity: 0; transform: none; }
      .active .face.front { opacity: 0; }
      .active .face.back { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header class="header">
      <span></span>
      <div class="app-title" id="appTitle">Never Sleep</div>
      <button class="icon-button" id="gearButton" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.55v-.1A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.1 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.3V9.55h.1A1.7 1.7 0 0 0 4.1 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.56 3.7l.06.06A1.7 1.7 0 0 0 8.5 4.1a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1v-.1h4.05v.1A1.7 1.7 0 0 0 15 4.1a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 8.5a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v4.05h-.1A1.7 1.7 0 0 0 19.4 15Z"/></svg>
      </button>
    </header>

    <div class="view-stack">
      <section class="view main-view visible" id="mainView">
        <button class="hero" id="heroButton" aria-label="Toggle screen-off standby">
          <div class="coin">
            <div class="face front"><img src="assets/sun.png" alt=""></div>
            <div class="face back"><img src="assets/moon.png" alt=""></div>
          </div>
        </button>

        <div class="status">
          <h1 id="statusTitle">Not active</h1>
          <p class="summary" id="summary"></p>
          <p class="warning" id="warning"></p>
        </div>

        <button class="primary" id="primaryButton">Start Screen-Off Standby</button>

        <div class="card">
          <div class="row">
            <label for="durationMain" id="durationLabelMain">Duration</label>
            <select id="durationMain" data-duration>
              <option value="indefinite">Indefinite</option>
              <option value="1h">1 hour</option>
              <option value="3h">3 hours</option>
              <option value="8h">8 hours</option>
              <option value="until_0800">Until 08:00</option>
            </select>
          </div>
          <div class="row">
            <span class="row-label" id="resleepLabelMain">Re-sleep after you leave</span>
            <label class="switch"><input type="checkbox" data-option="resleep_display"><span></span></label>
          </div>
          <div class="row">
            <span class="row-label" id="batteryLabelMain">End at low battery</span>
            <label class="switch"><input type="checkbox" data-option="battery_floor"><span></span></label>
          </div>
        </div>

        <footer class="footer">
          <button class="text-button" id="moreButton">More Settings</button>
          <span class="divider"></span>
          <button class="text-button" data-command="quit" id="quitButtonMain">Quit</button>
        </footer>
      </section>

      <section class="view settings-view" id="settingsView">
        <div class="settings-head">
          <button class="icon-button" id="backButton" aria-label="Back" title="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h2 id="settingsTitle">Settings</h2>
          <span></span>
        </div>

        <div class="card">
          <div class="row"><span class="row-label" id="screenOffLabel">Sleep display immediately</span><label class="switch"><input type="checkbox" data-option="screen_off"><span></span></label></div>
          <div class="row"><span class="row-label" id="lidAwakeLabel">Keep running with lid closed</span><label class="switch"><input type="checkbox" data-option="lid_awake"><span></span></label></div>
          <div class="row"><span class="row-label" id="resleepLabelSettings">Re-sleep after you leave</span><label class="switch"><input type="checkbox" data-option="resleep_display"><span></span></label></div>
          <div class="row"><span class="row-label" id="lockLabel">Lock when display sleeps</span><label class="switch"><input type="checkbox" data-option="lock_screen"><span></span></label></div>
          <div class="row"><span class="row-label" id="batteryLabelSettings">End at low battery</span><label class="switch"><input type="checkbox" data-option="battery_floor"><span></span></label></div>
          <div class="row"><span class="row-label" id="loginLabel">Launch at login</span><label class="switch"><input type="checkbox" data-option="launch_at_login"><span></span></label></div>
        </div>

        <div class="language-row" role="group" aria-label="Language">
          <button data-language="en">English</button>
          <button data-language="zh">简体中文</button>
        </div>

        <div class="settings-actions">
          <button class="text-button" data-command="help" id="helpButton">Help</button>
          <span class="divider"></span>
          <button class="text-button" data-command="quit" id="quitButtonSettings">Quit</button>
        </div>
      </section>
    </div>
  </div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => [...document.querySelectorAll(selector)];
    const shell = $('#shell');
    const previewMode = !window.ipc && new URLSearchParams(location.search).has('preview');
    let state = null;
    let busy = false;

    function post(message) {
      if (window.ipc && typeof window.ipc.postMessage === 'function') {
        window.ipc.postMessage(JSON.stringify(message));
      }
    }

    function setView(settings) {
      $('#mainView').classList.toggle('visible', !settings);
      $('#settingsView').classList.toggle('visible', settings);
      $('#gearButton').style.visibility = settings ? 'hidden' : 'visible';
    }

    function setText(id, value) {
      const node = document.getElementById(id);
      if (node && value != null) node.textContent = value;
    }

    function render(next) {
      state = next;
      document.documentElement.lang = next.lang;
      shell.classList.toggle('active', !!next.active);
      setText('appTitle', next.labels.app_name);
      setText('statusTitle', next.labels.status_title);
      setText('summary', next.labels.summary);
      setText('primaryButton', next.labels.primary_action);
      setText('durationLabelMain', next.labels.duration);
      setText('resleepLabelMain', next.labels.resleep);
      setText('batteryLabelMain', next.labels.battery);
      setText('moreButton', next.labels.more_settings);
      setText('quitButtonMain', next.labels.quit);
      setText('settingsTitle', next.labels.settings);
      setText('screenOffLabel', next.labels.screen_off);
      setText('lidAwakeLabel', next.labels.lid_awake);
      setText('resleepLabelSettings', next.labels.resleep);
      setText('lockLabel', next.labels.lock_screen);
      setText('batteryLabelSettings', next.labels.battery);
      setText('loginLabel', next.labels.launch_at_login);
      setText('helpButton', next.labels.help);
      setText('quitButtonSettings', next.labels.quit);

      const warning = $('#warning');
      warning.textContent = next.warning || '';
      warning.classList.toggle('show', !!next.warning);

      $$('[data-duration]').forEach((select) => {
        select.value = next.duration;
        const options = next.labels.duration_options;
        [...select.options].forEach((option) => { option.textContent = options[option.value]; });
      });
      $$('[data-option]').forEach((input) => { input.checked = !!next.options[input.dataset.option]; });
      $$('[data-language]').forEach((button) => button.classList.toggle('selected', button.dataset.language === next.lang));

      const actionLabel = next.labels.primary_action;
      $('#heroButton').setAttribute('aria-label', actionLabel);
      $('#gearButton').setAttribute('aria-label', next.labels.settings);
      $('#gearButton').title = next.labels.settings;
      $('#backButton').setAttribute('aria-label', next.labels.back);
      $('#backButton').title = next.labels.back;
      busy = false;
      $('#heroButton').disabled = false;
      $('#primaryButton').disabled = false;
      document.body.classList.add('ready');
    }

    function toggle() {
      if (!state || busy) return;
      if (previewMode) {
        render(previewState(!state.active, state.lang));
        return;
      }
      busy = true;
      state = { ...state, active: !state.active };
      shell.classList.toggle('active', state.active);
      $('#heroButton').disabled = true;
      $('#primaryButton').disabled = true;
      post({ type: 'toggle' });
      window.setTimeout(() => {
        if (busy) {
          busy = false;
          $('#heroButton').disabled = false;
          $('#primaryButton').disabled = false;
          post({ type: 'ready' });
        }
      }, 900);
    }

    function previewState(active, lang) {
      const zh = lang === 'zh';
      return {
        active,
        lang,
        duration: 'indefinite',
        warning: '',
        options: { screen_off: true, lid_awake: true, resleep_display: true, lock_screen: false, battery_floor: true, launch_at_login: false },
        labels: {
          app_name: zh ? '熄屏待命' : 'Never Sleep',
          status_title: active ? (zh ? '熄屏待命中' : 'Screen-Off Standby') : (zh ? '未开启' : 'Not Active'),
          summary: active ? (zh ? '屏幕已休眠，Mac 仍在线' : 'Display asleep, Mac stays online') : (zh ? '屏幕将关闭，Mac 保持在线' : 'Display off, Mac stays online'),
          primary_action: active ? (zh ? '结束熄屏待命' : 'End Screen-Off Standby') : (zh ? '开始熄屏待命' : 'Start Screen-Off Standby'),
          duration: zh ? '时长' : 'Duration',
          duration_options: { indefinite: zh ? '无限期' : 'Indefinite', '1h': zh ? '1 小时' : '1 hour', '3h': zh ? '3 小时' : '3 hours', '8h': zh ? '8 小时' : '8 hours', until_0800: zh ? '直到 08:00' : 'Until 08:00' },
          resleep: zh ? '人离开后自动再关屏' : 'Re-sleep after you leave',
          battery: zh ? '电量低于 20% 时结束' : 'End at 20% battery',
          more_settings: zh ? '更多设置' : 'More Settings',
          settings: zh ? '设置' : 'Settings',
          back: zh ? '返回' : 'Back',
          screen_off: zh ? '立即关闭屏幕' : 'Sleep display immediately',
          lid_awake: zh ? '合盖尽量保持运行' : 'Keep running when the lid is closed',
          lock_screen: zh ? '关屏时锁定登录' : 'Lock the session when the display sleeps',
          launch_at_login: zh ? '登录时启动' : 'Launch at login',
          help: zh ? '使用说明' : 'Help',
          quit: zh ? '退出' : 'Quit'
        }
      };
    }

    window.NeverSleep = { update: render };
    $('#heroButton').addEventListener('click', toggle);
    $('#primaryButton').addEventListener('click', toggle);
    $('#gearButton').addEventListener('click', () => setView(true));
    $('#moreButton').addEventListener('click', () => setView(true));
    $('#backButton').addEventListener('click', () => setView(false));
    $$('[data-duration]').forEach((select) => select.addEventListener('change', () => post({ type: 'set_duration', value: select.value })));
    $$('[data-option]').forEach((input) => input.addEventListener('change', () => post({ type: 'set_option', key: input.dataset.option, enabled: input.checked })));
    $$('[data-language]').forEach((button) => button.addEventListener('click', () => post({ type: 'set_language', language: button.dataset.language })));
    $$('[data-command]').forEach((button) => button.addEventListener('click', () => post({ type: button.dataset.command })));
    window.addEventListener('keydown', (event) => { if (event.key === 'Escape') post({ type: 'hide' }); });
    window.addEventListener('DOMContentLoaded', () => {
      if (previewMode) {
        const params = new URLSearchParams(location.search);
        render(previewState(params.get('state') === 'active', params.get('lang') === 'zh' ? 'zh' : 'en'));
      } else {
        post({ type: 'ready' });
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      font-size: 13px;
      --popover-inset-x: 16px;
      --arrow-x: 190px;
      --bg: rgba(246, 246, 247, .72);
      --ink: rgba(0, 0, 0, .85);
      --muted: rgba(60, 60, 67, .64);
      --hairline: rgba(60, 60, 67, .16);
      --stroke: rgba(0, 0, 0, .10);
      --surface: rgba(255, 255, 255, .72);
      --surface-solid: #fff;
      --surface-hover: rgba(0, 0, 0, .05);
      --fill: rgba(118, 118, 128, .12);
      --accent: #007aff;
      --accent-ink: #fff;
      --switch-on: #34c759;
      --switch-off: #e5e5ea;
      --warning: #c93400;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body {
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: default;
      opacity: 0;
      transition: opacity 120ms ease;
    }
    body.ready { opacity: 1; }
    html.preview, html.preview body {
      background:
        radial-gradient(ellipse at 28% 0%, #4f8b96 0%, transparent 42%),
        linear-gradient(165deg, #16343c, #0b1f28 58%, #142c38);
    }

    button, select, input { font: inherit; }
    button { color: inherit; }

    .float {
      position: absolute;
      inset: 12px var(--popover-inset-x) 24px;
      filter:
        drop-shadow(0 10px 20px rgba(0, 0, 0, .18))
        drop-shadow(0 2px 4px rgba(0, 0, 0, .06));
      transition: filter 420ms ease;
    }
    .float::before {
      content: "";
      position: absolute;
      z-index: 4;
      top: 1.5px;
      left: calc(var(--arrow-x, 50%) - var(--popover-inset-x) - 7px);
      width: 14px;
      height: 14px;
      background: var(--bg);
      border-left: 0.5px solid var(--stroke);
      border-top: 0.5px solid var(--stroke);
      border-top-left-radius: 3px;
      transform: rotate(45deg);
      transition: background 420ms ease, border-color 420ms ease;
    }

    .panel {
      position: absolute;
      inset: 8px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink);
      background: var(--bg);
      -webkit-backdrop-filter: saturate(180%) blur(40px);
      backdrop-filter: saturate(180%) blur(40px);
      border: 0.5px solid var(--stroke);
      border-radius: 12px;
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, .55);
      transition: color 420ms ease, background 420ms ease, border-color 420ms ease, box-shadow 420ms ease;
    }

    .float.active {
      color-scheme: dark;
      --bg: rgba(30, 30, 32, .78);
      --ink: rgba(255, 255, 255, .92);
      --muted: rgba(235, 235, 245, .62);
      --hairline: rgba(84, 84, 88, .55);
      --stroke: rgba(255, 255, 255, .14);
      --surface: rgba(44, 44, 46, .72);
      --surface-solid: #2c2c2e;
      --surface-hover: rgba(255, 255, 255, .08);
      --fill: rgba(120, 120, 128, .32);
      --accent: #0a84ff;
      --accent-ink: #fff;
      --switch-on: #30d158;
      --switch-off: rgba(120, 120, 128, .36);
      --warning: #ff9f0a;
    }
    .float.active .panel {
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, .10);
    }

    .header {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      flex: 0 0 44px;
      padding: 4px 10px 0;
    }
    .app-title {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .icon-button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    .icon-button:hover { color: var(--ink); background: var(--surface-hover); }
    .icon-button svg { width: 17px; height: 17px; }

    .view-stack { position: relative; flex: 1; min-height: 0; }
    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 0 16px 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(16px);
      transition: opacity 180ms ease, transform 220ms cubic-bezier(.2, .8, .2, 1);
    }
    .view.visible { opacity: 1; pointer-events: auto; transform: translateX(0); }
    .main-view:not(.visible) { transform: translateX(-16px); }

    .hero {
      position: relative;
      width: 144px;
      height: 144px;
      margin: 2px auto 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .92), rgba(255, 255, 255, .55) 58%, rgba(255, 255, 255, .0) 59%),
        var(--surface);
      box-shadow:
        inset 0 0 0 0.5px var(--hairline),
        0 10px 24px rgba(0, 0, 0, .06);
      cursor: pointer;
      perspective: 760px;
      transition: transform 130ms ease, box-shadow 420ms ease, background 420ms ease;
    }
    .float.active .hero {
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03) 58%, transparent 59%),
        rgba(255, 255, 255, .06);
      box-shadow:
        inset 0 0 0 0.5px var(--hairline),
        0 12px 28px rgba(0, 0, 0, .28);
    }
    .hero:hover { transform: scale(1.016); }
    .hero:active { transform: scale(.985); }
    .hero:focus-visible,
    .primary:focus-visible,
    .icon-button:focus-visible,
    select:focus-visible,
    .switch input:focus-visible + span {
      outline: 3px solid rgba(0, 122, 255, .48);
      outline-offset: 2px;
    }
    .float.active .hero:focus-visible,
    .float.active .primary:focus-visible,
    .float.active .icon-button:focus-visible,
    .float.active select:focus-visible,
    .float.active .switch input:focus-visible + span {
      outline-color: rgba(10, 132, 255, .55);
    }

    .coin { position: absolute; inset: 10px; transform-style: preserve-3d; transition: transform 520ms cubic-bezier(.22, .78, .18, 1.12); }
    .float.active .coin { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .face.back { transform: rotateY(180deg); }
    .face img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .16)); }
    .face.back img { width: 94%; height: 94%; }

    .status { margin: 10px 0 0; text-align: center; }
    .status h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -.028em;
    }
    .summary { min-height: 18px; margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; letter-spacing: -.01em; }
    .warning { display: none; margin: 6px auto 0; max-width: 290px; color: var(--warning); font-size: 12px; line-height: 1.3; }
    .warning.show { display: block; }

    .primary {
      width: 100%;
      height: 32px;
      margin: 14px 0 12px;
      border: 0;
      border-radius: 8px;
      color: var(--accent-ink);
      background: var(--accent);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.02em;
      cursor: pointer;
      transition: filter 120ms ease, transform 120ms ease, background 420ms ease;
    }
    .primary:hover { filter: brightness(1.06); }
    .primary:active { transform: translateY(0.5px); filter: brightness(.96); }
    .primary[disabled] { cursor: default; opacity: .72; }
    .float.active .primary {
      background: rgba(255, 255, 255, .14);
      color: #f5f5f7;
    }
    .float.active .primary:hover { filter: brightness(1.12); }

    .card {
      overflow: hidden;
      border: 0.5px solid var(--hairline);
      border-radius: 10px;
      background: var(--surface);
    }
    .row {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 38px;
      padding: 7px 12px;
      gap: 10px;
    }
    .row:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 0;
      bottom: 0;
      height: 0.5px;
      background: var(--hairline);
    }
    .row label:not(.switch), .row .row-label { flex: 1; min-width: 0; line-height: 1.25; letter-spacing: -.01em; }
    select {
      max-width: 148px;
      margin: 0;
      padding: 2px 16px 2px 6px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background-color: transparent;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='14' viewBox='0 0 9 14'><path fill='%238e8e93' d='M4.5 1.4 1.35 4.7a.65.65 0 1 1-.9-.94L4.05.1a.65.65 0 0 1 .9 0l3.6 3.66a.65.65 0 1 1-.9.94L4.5 1.4Zm0 11.2 3.15-3.3a.65.65 0 1 1 .9.94l-3.6 3.66a.65.65 0 0 1-.9 0L.45 10.24a.65.65 0 1 1 .9-.94L4.5 12.6Z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 1px center;
      background-size: 9px 12px;
      text-align: right;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    select:hover { color: var(--ink); background-color: var(--surface-hover); }
    .float.active select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='14' viewBox='0 0 9 14'><path fill='%23ebebf5' fill-opacity='.62' d='M4.5 1.4 1.35 4.7a.65.65 0 1 1-.9-.94L4.05.1a.65.65 0 0 1 .9 0l3.6 3.66a.65.65 0 1 1-.9.94L4.5 1.4Zm0 11.2 3.15-3.3a.65.65 0 1 1 .9.94l-3.6 3.66a.65.65 0 0 1-.9 0L.45 10.24a.65.65 0 1 1 .9-.94L4.5 12.6Z'/></svg>");
    }

    .switch {
      position: relative;
      flex: 0 0 40px;
      width: 40px;
      min-width: 40px;
      max-width: 40px;
      height: 24px;
      align-self: center;
    }
    .switch input {
      position: absolute;
      z-index: 1;
      inset: 0;
      margin: 0;
      opacity: 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--switch-off);
      transition: background 180ms ease;
      pointer-events: none;
    }
    .switch span::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 1px;
      top: 1px;
      border-radius: 50%;
      background: #fff;
      box-shadow:
        0 3px 8px rgba(0, 0, 0, .12),
        0 1px 1px rgba(0, 0, 0, .06),
        0 0 0 0.5px rgba(0, 0, 0, .04);
      transition: transform 200ms cubic-bezier(.22, 1, .36, 1);
    }
    .switch input:checked + span { background: var(--switch-on); }
    .switch input:checked + span::after { transform: translateX(16px); }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      margin-top: auto;
      padding-top: 8px;
    }
    .text-button {
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    .text-button:hover { color: var(--ink); background: var(--surface-hover); }
    .divider { width: 0.5px; height: 12px; margin: 0 2px; background: var(--hairline); }

    .settings-view { padding-top: 0; }
    .settings-head {
      display: grid;
      grid-template-columns: 32px 1fr 32px;
      align-items: center;
      height: 36px;
      margin: 0 0 8px;
    }
    .settings-head h2 { margin: 0; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
    .settings-view .card { flex: 0 0 auto; }
    .settings-view .row { min-height: 36px; padding: 6px 12px; }
    .language-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-top: 12px;
      padding: 2px;
      border: 0;
      border-radius: 9px;
      background: var(--fill);
    }
    .language-row button {
      height: 28px;
      border: 0;
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .language-row button.selected {
      background: var(--surface-solid);
      box-shadow: 0 0.5px 1px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .04);
      font-weight: 600;
    }
    .float.active .language-row button.selected {
      background: rgba(255, 255, 255, .18);
      box-shadow: 0 0.5px 1px rgba(0, 0, 0, .28);
    }
    .settings-actions { display: flex; justify-content: center; gap: 2px; margin-top: auto; padding-top: 10px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 150ms !important; animation-duration: 150ms !important; }
      .coin, .float.active .coin { transform: none; }
      .face { transition: opacity 150ms ease !important; }
      .face.front { opacity: 1; }
      .face.back { opacity: 0; transform: none; }
      .float.active .face.front { opacity: 0; }
      .float.active .face.back { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="float" id="shell">
    <div class="panel">
      <header class="header">
        <span></span>
        <div class="app-title" id="appTitle">Never Sleep</div>
        <button class="icon-button" id="gearButton" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15Z"/></svg>
        </button>
      </header>

      <div class="view-stack">
        <section class="view main-view visible" id="mainView">
          <button class="hero" id="heroButton" aria-label="Toggle screen-off standby">
            <div class="coin">
              <div class="face front"><img src="assets/sun.png" alt=""></div>
              <div class="face back"><img src="assets/moon.png" alt=""></div>
            </div>
          </button>

          <div class="status">
            <h1 id="statusTitle">Not active</h1>
            <p class="summary" id="summary"></p>
            <p class="warning" id="warning"></p>
          </div>

          <button class="primary" id="primaryButton">Start Screen-Off Standby</button>

          <div class="card">
            <div class="row">
              <label for="durationMain" id="durationLabelMain">Duration</label>
              <select id="durationMain" data-duration>
                <option value="indefinite">Indefinite</option>
                <option value="1h">1 hour</option>
                <option value="3h">3 hours</option>
                <option value="8h">8 hours</option>
                <option value="until_0800">Until 08:00</option>
              </select>
            </div>
            <div class="row">
              <span class="row-label" id="resleepLabelMain">Re-sleep after you leave</span>
              <label class="switch"><input type="checkbox" data-option="resleep_display"><span></span></label>
            </div>
            <div class="row">
              <span class="row-label" id="batteryLabelMain">End at low battery</span>
              <label class="switch"><input type="checkbox" data-option="battery_floor"><span></span></label>
            </div>
          </div>

          <footer class="footer">
            <button class="text-button" id="moreButton">More Settings</button>
            <span class="divider"></span>
            <button class="text-button" data-command="quit" id="quitButtonMain">Quit</button>
          </footer>
        </section>

        <section class="view settings-view" id="settingsView">
          <div class="settings-head">
            <button class="icon-button" id="backButton" aria-label="Back" title="Back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h2 id="settingsTitle">Settings</h2>
            <span></span>
          </div>

          <div class="card">
            <div class="row"><span class="row-label" id="screenOffLabel">Sleep display immediately</span><label class="switch"><input type="checkbox" data-option="screen_off"><span></span></label></div>
            <div class="row"><span class="row-label" id="lidAwakeLabel">Keep running with lid closed</span><label class="switch"><input type="checkbox" data-option="lid_awake"><span></span></label></div>
            <div class="row"><span class="row-label" id="resleepLabelSettings">Re-sleep after you leave</span><label class="switch"><input type="checkbox" data-option="resleep_display"><span></span></label></div>
            <div class="row"><span class="row-label" id="lockLabel">Lock when display sleeps</span><label class="switch"><input type="checkbox" data-option="lock_screen"><span></span></label></div>
            <div class="row"><span class="row-label" id="batteryLabelSettings">End at low battery</span><label class="switch"><input type="checkbox" data-option="battery_floor"><span></span></label></div>
            <div class="row"><span class="row-label" id="loginLabel">Launch at login</span><label class="switch"><input type="checkbox" data-option="launch_at_login"><span></span></label></div>
          </div>

          <div class="language-row" role="group" aria-label="Language">
            <button type="button" data-language="en">English</button>
            <button type="button" data-language="zh">简体中文</button>
          </div>

          <div class="settings-actions">
            <button class="text-button" data-command="help" id="helpButton">Help</button>
            <span class="divider"></span>
            <button class="text-button" data-command="quit" id="quitButtonSettings">Quit</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => [...document.querySelectorAll(selector)];
    const shell = $('#shell');
    const previewMode = !window.ipc && new URLSearchParams(location.search).has('preview');
    let state = null;
    let busy = false;

    function post(message) {
      if (window.ipc && typeof window.ipc.postMessage === 'function') {
        window.ipc.postMessage(JSON.stringify(message));
      }
    }

    function setView(settings) {
      $('#mainView').classList.toggle('visible', !settings);
      $('#settingsView').classList.toggle('visible', settings);
      $('#gearButton').style.visibility = settings ? 'hidden' : 'visible';
    }

    function setText(id, value) {
      const node = document.getElementById(id);
      if (node && value != null) node.textContent = value;
    }

    function render(next) {
      state = next;
      document.documentElement.lang = next.lang;
      shell.classList.toggle('active', !!next.active);
      setText('appTitle', next.labels.app_name);
      setText('statusTitle', next.labels.status_title);
      setText('summary', next.labels.summary);
      setText('primaryButton', next.labels.primary_action);
      setText('durationLabelMain', next.labels.duration);
      setText('resleepLabelMain', next.labels.resleep);
      setText('batteryLabelMain', next.labels.battery);
      setText('moreButton', next.labels.more_settings);
      setText('quitButtonMain', next.labels.quit);
      setText('settingsTitle', next.labels.settings);
      setText('screenOffLabel', next.labels.screen_off);
      setText('lidAwakeLabel', next.labels.lid_awake);
      setText('resleepLabelSettings', next.labels.resleep);
      setText('lockLabel', next.labels.lock_screen);
      setText('batteryLabelSettings', next.labels.battery);
      setText('loginLabel', next.labels.launch_at_login);
      setText('helpButton', next.labels.help);
      setText('quitButtonSettings', next.labels.quit);

      const warning = $('#warning');
      warning.textContent = next.warning || '';
      warning.classList.toggle('show', !!next.warning);

      $$('[data-duration]').forEach((select) => {
        select.value = next.duration;
        const options = next.labels.duration_options;
        [...select.options].forEach((option) => { option.textContent = options[option.value]; });
      });
      $$('[data-option]').forEach((input) => { input.checked = !!next.options[input.dataset.option]; });
      $$('[data-language]').forEach((button) => button.classList.toggle('selected', button.dataset.language === next.lang));

      const actionLabel = next.labels.primary_action;
      $('#heroButton').setAttribute('aria-label', actionLabel);
      $('#gearButton').setAttribute('aria-label', next.labels.settings);
      $('#gearButton').title = next.labels.settings;
      $('#backButton').setAttribute('aria-label', next.labels.back);
      $('#backButton').title = next.labels.back;
      busy = false;
      $('#heroButton').disabled = false;
      $('#primaryButton').disabled = false;
      document.body.classList.add('ready');
    }

    function toggle() {
      if (!state || busy) return;
      if (previewMode) {
        render(previewState(!state.active, state.lang));
        return;
      }
      busy = true;
      state = { ...state, active: !state.active };
      shell.classList.toggle('active', state.active);
      $('#heroButton').disabled = true;
      $('#primaryButton').disabled = true;
      post({ type: 'toggle' });
      window.setTimeout(() => {
        if (busy) {
          busy = false;
          $('#heroButton').disabled = false;
          $('#primaryButton').disabled = false;
          post({ type: 'ready' });
        }
      }, 900);
    }

    function previewState(active, lang) {
      const zh = lang === 'zh';
      return {
        active,
        lang,
        duration: 'indefinite',
        warning: '',
        options: { screen_off: true, lid_awake: true, resleep_display: true, lock_screen: false, battery_floor: true, launch_at_login: false },
        labels: {
          app_name: zh ? '熄屏待命' : 'Never Sleep',
          status_title: active ? (zh ? '熄屏待命中' : 'Screen-Off Standby') : (zh ? '未开启' : 'Not Active'),
          summary: active ? (zh ? '屏幕已休眠，Mac 仍在线' : 'Display asleep, Mac stays online') : (zh ? '屏幕将关闭，Mac 保持在线' : 'Display off, Mac stays online'),
          primary_action: active ? (zh ? '结束熄屏待命' : 'End Screen-Off Standby') : (zh ? '开始熄屏待命' : 'Start Screen-Off Standby'),
          duration: zh ? '时长' : 'Duration',
          duration_options: { indefinite: zh ? '无限期' : 'Indefinite', '1h': zh ? '1 小时' : '1 hour', '3h': zh ? '3 小时' : '3 hours', '8h': zh ? '8 小时' : '8 hours', until_0800: zh ? '直到 08:00' : 'Until 08:00' },
          resleep: zh ? '人离开后自动再关屏' : 'Re-sleep after you leave',
          battery: zh ? '电量低于 20% 时结束' : 'End at 20% battery',
          more_settings: zh ? '更多设置' : 'More Settings',
          settings: zh ? '设置' : 'Settings',
          back: zh ? '返回' : 'Back',
          screen_off: zh ? '立即关闭屏幕' : 'Sleep display immediately',
          lid_awake: zh ? '合盖尽量保持运行' : 'Keep running when the lid is closed',
          lock_screen: zh ? '关屏时锁定登录' : 'Lock the session when the display sleeps',
          launch_at_login: zh ? '登录时启动' : 'Launch at login',
          help: zh ? '使用说明' : 'How to use',
          quit: zh ? '退出' : 'Quit'
        }
      };
    }

    window.NeverSleep = { update: render };
    $('#heroButton').addEventListener('click', toggle);
    $('#primaryButton').addEventListener('click', toggle);
    $('#gearButton').addEventListener('click', () => setView(true));
    $('#moreButton').addEventListener('click', () => setView(true));
    $('#backButton').addEventListener('click', () => setView(false));
    $$('[data-duration]').forEach((select) => select.addEventListener('change', () => post({ type: 'set_duration', value: select.value })));
    $$('[data-option]').forEach((input) => input.addEventListener('change', () => post({ type: 'set_option', key: input.dataset.option, enabled: input.checked })));
    $$('[data-language]').forEach((button) => button.addEventListener('click', () => {
      if (previewMode) {
        render(previewState(!!(state && state.active), button.dataset.language));
        return;
      }
      post({ type: 'set_language', language: button.dataset.language });
    }));
    $$('[data-command]').forEach((button) => button.addEventListener('click', () => post({ type: button.dataset.command })));
    window.addEventListener('keydown', (event) => { if (event.key === 'Escape') post({ type: 'hide' }); });
    window.addEventListener('DOMContentLoaded', () => {
      if (previewMode) {
        document.documentElement.classList.add('preview');
        const params = new URLSearchParams(location.search);
        render(previewState(params.get('state') === 'active', params.get('lang') === 'zh' ? 'zh' : 'en'));
        if (params.get('view') === 'settings') setView(true);
      } else {
        post({ type: 'ready' });
      }
    });
  </script>
</body>
</html>

[package]
name = "never-sleep"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "熄屏待命：关掉屏幕，不让 Mac 睡眠，方便远程客户端随时接管"

[[bin]]
name = "never-sleep"
path = "src/main.rs"

[dependencies]
never-sleep-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.19"
tao = "0.30.8"
global-hotkey = "0.6"
libc = "0.2"
core-foundation = "0.10"

[dev-dependencies]
never-sleep-core = { workspace = true }

[package]
name = "never-sleep"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Never Sleep: turn the display off and keep the Mac awake for remote clients"

[[bin]]
name = "never-sleep"
path = "src/main.rs"

[dependencies]
never-sleep-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.19"
tao = "0.30.8"
global-hotkey = "0.6"
libc = "0.2"
core-foundation = "0.10"
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSString",
  "NSObject",
  "NSData",
  "NSArray",
  "NSGeometry",
  "NSThread",
  "NSValue",
  "NSCoder",
  "NSAttributedString",
  "NSNotification",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSControl",
  "NSButton",
  "NSButtonCell",
  "NSCell",
  "NSActionCell",
  "NSTextField",
  "NSTextFieldCell",
  "NSText",
  "NSStackView",
  "NSSwitch",
  "NSPopUpButton",
  "NSMenu",
  "NSMenuItem",
  "NSImage",
  "NSColor",
  "NSFont",
  "NSGraphics",
  "NSVisualEffectView",
  "NSGlassEffectView",
  "NSScrollView",
  "NSClipView",
  "NSSegmentedControl",
  "NSLayoutConstraint",
  "NSLayoutAnchor",
  "NSUserInterfaceLayout",
  "NSBox",
  "NSImageView",
  "NSApplication",
  "NSAppearance",
] }

[dev-dependencies]
never-sleep-core = { workspace = true }

[lints]
workspace = true

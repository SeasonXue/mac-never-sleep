[package]
name = "never-sleep"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Never Sleep: turn the display off and keep the Mac awake for remote clients"

[[bin]]
name = "never-sleep"
path = "src/main.rs"

[dependencies]
never-sleep-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.19"
tao = "0.30.8"
wry = { version = "0.56.1", default-features = false }
global-hotkey = "0.6"
libc = "0.2"
core-foundation = "0.10"
objc = "0.2"
cocoa = "0.26"

[dev-dependencies]
never-sleep-core = { workspace = true }

[lints]
workspace = true

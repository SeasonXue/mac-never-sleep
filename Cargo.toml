[workspace]
members = ["crates/never-sleep-core", "crates/never-sleep"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/SeasonXue/mac-never-sleep"
authors = ["SeasonXue"]

[workspace.dependencies]
never-sleep-core = { path = "crates/never-sleep-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
